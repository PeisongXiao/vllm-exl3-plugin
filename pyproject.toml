[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-exl3"
dynamic = ["version"]
description = "EXL3 (ExLlamaV3 trellis/MCG) quantization plugin for vLLM fork runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE.APACHE-2.0", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Victor Cruz" }]
maintainers = [{ name = "Peisong Xiao" }]
keywords = ["vllm", "exl3", "exllamav3", "quantization", "moe", "dgx-spark"]

[project.urls]
Homepage = "https://github.com/vcruz305/vllm-exl3"
Changelog = "https://github.com/vcruz305/vllm-exl3/blob/main/CHANGELOG.md"

[project.entry-points."vllm.general_plugins"]
vllm_exl3 = "vllm_exl3.bf16_madv_compat:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
